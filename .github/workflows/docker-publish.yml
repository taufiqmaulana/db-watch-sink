# Builds the server and publishes the image to Docker Hub.
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with read/write scope).
# The repository defaults to <DOCKERHUB_USERNAME>/datasync; set the repository variable DOCKERHUB_REPOSITORY to override.
#   push to master -> :master, :sha-<short>
#   tag v1.2.3     -> :1.2.3, :1.2, :1, :latest
#   pull request   -> build only, nothing pushed
name: Docker image

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_REPOSITORY || (secrets.DOCKERHUB_USERNAME && format('{0}/datasync', secrets.DOCKERHUB_USERNAME)) || 'datasync' }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: datasync-ui/package-lock.json

      # Tests run elsewhere (they need Testcontainers and a 1 GB Oracle image); this job only packages.
      - name: Build server
        run: ./mvnw -B -ntp install -DskipTests

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
          # metadata-action adds :latest for semver tags by default (flavor latest=auto)

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
