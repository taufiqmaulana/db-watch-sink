# Run: java -jar datasync-cli/target/datasync.jar run datasync.example.yaml [--job NAME] [--state data/datasync.db] [--allow-deletes]
connections:
  - name: oracle_prod
    kind: jdbc-oracle
    url: jdbc:oracle:thin:@//ora-host:1521/ORCLPDB1
    username: sync_ro
    password: ${env:ORA_PASSWORD}
  - name: pg_dw
    kind: jdbc-postgres
    url: jdbc:postgresql://pg-host:5432/dw
    username: sync_rw
    password: ${env:PG_PASSWORD}
  - name: crm_hook                      # a webhook: url and auth; the secret can come from the environment
    kind: webhook
    url: https://crm.example.com/hooks/customers
    authType: HMAC                      # NONE | BEARER | BASIC | HMAC
    password: ${env:CRM_HOOK_SECRET}    # the token, basic password or HMAC secret

jobs:
  - name: customers_sync
    source: { connection: oracle_prod, object: HR.CUSTOMERS_V }
    keys: [CUSTOMER_ID]               # required for views; tables default to their primary key
    columns:
      include: "*"
      exclude: []
      rename: { CUST_NAME: customer_name }
      coerce: { IS_VIP: BOOLEAN }       # convert a column's type, e.g. an Oracle NUMBER(1) flag
      emptyStrings: AUTO                # AUTO (NULL when a sink is Oracle) | KEEP | EMPTY_TO_NULL
    mode: SNAPSHOT_DIFF               # or WATERMARK (read only changed rows) or HYBRID (watermark + reconcile)
    # watermark: { column: UPDATED_AT, overlap: 5m }   # WATERMARK and HYBRID: an update time or increasing id
    # reconcile: { cron: "0 2 * * *" }                 # HYBRID: full compare that also applies deletes
    batchSize: 10000
    fetchSize: 5000
    maxDeletePercent: 20
    queryTimeoutSeconds: 300
    schedule: "*/5 * * * *"           # used by the server; the CLI runs each job once
    # every: 30s                      # or a fixed interval (at least 10s), which wins over schedule
    # fixedDelay: true                # count the interval from the end of each run, not its start
    jitterPercent: 10
    sinks:
      - type: jdbc
        connection: pg_dw
        target: public.customers
        autoCreate: true
        deleteMode: SOFT                # SOFT | HARD | IGNORE
        rowHash: true                   # keep a _row_hash column and skip rewriting unchanged rows
        retry: { maxAttempts: 5, initialBackoff: 1s, maxBackoff: 1m }   # every sink; these are the defaults
        onDeadLetter: PAUSE             # PAUSE (stop the run and pause the job) | SKIP (carry on)
      - type: webhook
        connection: crm_hook            # or give url, auth: { type, username, secret } inline
        batch: { mode: per-batch, maxRows: 500 }   # or mode: per-row
        deleteAs: delete                # or upsert-with-flag: the last row with "_is_deleted": true
        timeoutSeconds: 10
        # headers: { X-Team: data }
        onDeadLetter: SKIP
