quarkus.rest.path=/api/v1
quarkus.smallrye-openapi.info-title=DataSync API
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.log.category."com.zaxxer.hikari".level=WARN

# Where the SQLite state store (and a generated master key, if DATASYNC_MASTER_KEY is unset) live.
datasync.data-dir=data
%test.datasync.data-dir=${java.io.tmpdir}/datasync-test-${quarkus.uuid}
%test.datasync.admin-password=bootstrap-secret
%dev.datasync.data-dir=target/dev-data
%dev.datasync.admin-password=admin-password
