quarkus.rest.path=/api/v1
quarkus.smallrye-openapi.info-title=DataSync API
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.log.category."com.zaxxer.hikari".level=WARN

# Prometheus metrics at /metrics (design 12), unauthenticated like the health checks
quarkus.micrometer.export.prometheus.path=/metrics

# Where the SQLite state store (and a generated master key, if DATASYNC_MASTER_KEY is unset) live.
datasync.data-dir=data
%test.datasync.data-dir=${java.io.tmpdir}/datasync-test-${quarkus.uuid}
%test.datasync.admin-password=bootstrap-secret
%dev.datasync.data-dir=target/dev-data
%dev.datasync.admin-password=admin-password
# Production needs DATASYNC_MASTER_KEY; a key file next to the data is for dev and test only (see Secrets)
%dev.datasync.allow-key-file=true
%test.datasync.allow-key-file=true

# Browser hardening for the UI: no framing (clickjacking), no MIME sniffing, own scripts only. Not in dev, where the
# Dev UI needs inline scripts; HSTS is left to the TLS proxy.
%prod,test.quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'
%prod,test.quarkus.http.header."X-Frame-Options".value=DENY
%prod,test.quarkus.http.header."X-Content-Type-Options".value=nosniff
%prod,test.quarkus.http.header."Referrer-Policy".value=no-referrer

# Structured JSON logs (design 12), with jobId and runId from the MDC: set DATASYNC_LOG_JSON=true
quarkus.log.console.json.enabled=${DATASYNC_LOG_JSON:false}

# Alert emails go through SMTP: set QUARKUS_MAILER_HOST, _PORT, _FROM, _USERNAME, _PASSWORD and _TLS.
# In dev and test they are only logged (Quarkus mocks the mailer there).
quarkus.mailer.from=datasync@localhost
